version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint n'accepte pas encore TypeScript 7 : npm ci échoue avec ERESOLVE
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
